name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest we support (macOS's own python3), and the newest.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff check src tests && uvx ruff format --check src tests

  examples:
    # Each example through a real Renovate, in podman (on GitHub's Ubuntu runners).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: podman pull ghcr.io/renovatebot/renovate:latest
      - run: make examples
