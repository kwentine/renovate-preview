name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# pytest and ruff come from uv.lock, as they do locally with `uv run`. --locked fails the
# job if uv.lock is out of date with pyproject.toml.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest we support (macOS's own python3), and the newest.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked --python ${{ matrix.python }} make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked make lint

  examples:
    # Each example through a real Renovate, in podman (on GitHub's Ubuntu runners).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: podman pull ghcr.io/renovatebot/renovate:latest
      - run: uv run --locked make examples
