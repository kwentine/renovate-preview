[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renovate-preview"
dynamic = ["version"]  # from src/renovate_preview/__init__.py
description = "Dry-run Renovate against a repository and see what it would do."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Quentin Ågren", email = "quentin@scilifelab.se" }]
keywords = ["renovate", "dependencies", "dry-run", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kwentine/renovate-preview"
Source = "https://github.com/kwentine/renovate-preview"

[project.scripts]
renovate-preview = "renovate_preview.cli:main"

[tool.hatch.version]
path = "src/renovate_preview/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/renovate_preview"]

[tool.hatch.build.targets.sdist]
include = ["src/renovate_preview", "tests", "examples", "docs", "README.md", "Makefile", "LICENSE"]

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
