[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renovate-preview"
version = "0.1.0"
description = "Dry-run Renovate against a repository and see what it would do."
# PyPI renders no org-mode, so the README is shown as plain text.
readme = { file = "README.org", content-type = "text/plain" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Quentin Ågren", email = "quentin@scilifelab.se" }]
keywords = ["renovate", "dependencies", "kubernetes", "dry-run", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ScilifelabDataCentre/renovate-preview"
Source = "https://github.com/ScilifelabDataCentre/renovate-preview"

[project.scripts]
renovate-preview = "renovate_preview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/renovate_preview"]

[tool.hatch.build.targets.sdist]
include = ["src/renovate_preview", "tests", "examples", "docs", "README.org", "Makefile", "LICENSE"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
