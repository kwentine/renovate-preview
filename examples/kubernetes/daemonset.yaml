apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: example
  namespace: example
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example
    spec:
      containers:
        - name: example
          image: docker.io/library/busybox:1.36
