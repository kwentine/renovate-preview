apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-chart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://example.github.io/helm-charts
    chart: example-chart
    targetRevision: 1.2.3
  destination:
    server: https://kubernetes.default.svc
    namespace: example
